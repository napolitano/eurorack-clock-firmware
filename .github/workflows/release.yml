name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, build and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential doxygen libreoffice-writer poppler-utils fonts-ubuntu-classic
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19" pillow lxml

      - name: Enforce architecture policy
        run: python scripts/check_architecture.py

      - name: Enforce embedded dependency policy
        run: python scripts/check_embedded_dependencies.py

      - name: Validate repository documentation
        run: python scripts/check_documentation.py

      - name: Validate HIL qualification ledger
        run: python scripts/check_hil_qualification.py --require-pass-from 1.5.0

      - name: Build Doxygen API documentation
        run: doxygen Doxyfile

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python scripts/version.py --check-tag "${GITHUB_REF_NAME}"

      - name: Run release-tooling tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Enforce VCV runtime adapter coverage
        run: python scripts/check_vcv_runtime_coverage.py

      - name: Validate native test inventory
        run: python scripts/check_test_inventory.py

      - name: Run native tests
        run: pio test -e native

      - name: Run complete host firmware tests and coverage gate
        run: python scripts/run_host_tests.py --skip-sanitizers

      - name: Run ASan and UBSan matrix
        run: python scripts/run_host_tests.py --sanitizers-only

      - name: Configure headless simulator
        run: cmake --preset simulator-headless

      - name: Build headless simulator
        run: cmake --build --preset simulator-headless

      - name: Run simulator integration tests
        run: ctest --preset simulator-headless

      - name: Regenerate manual OLED screenshots from this release source
        run: python scripts/generate_manual_screenshots.py

      - name: Build and package all firmware flavors
        run: |
          rm -rf dist
          mkdir -p dist
          while IFS='|' read -r ENVIRONMENT FLAVOR; do
            echo "Building ${ENVIRONMENT} (${FLAVOR})"
            pio run -e "${ENVIRONMENT}"
            test -f ".pio/build/${ENVIRONMENT}/firmware.map" || {
              echo "Missing linker map for ${ENVIRONMENT}" >&2
              exit 1
            }
            python scripts/package_release.py firmware \
              --build-dir ".pio/build/${ENVIRONMENT}" \
              --out-dir dist \
              --variant "${FLAVOR}"
          done <<'EOF'
          release_default|default
          release_pixel_raid|pixel-raid
          release_formula_1|formula-1
          release_breakout|breakout
          release_egg_journey|egg-journey
          EOF

      - name: Capture exact ARM toolchain licenses
        run: |
          python scripts/package_release.py toolchain-licenses \
            --out-dir dist \
            --toolchain-dir "$HOME/.platformio/packages/toolchain-gccarmnoneeabi"

      - name: Generate linker-map build provenance
        run: |
          python scripts/package_release.py build-info \
            --out-dir dist \
            --toolchain-dir "$HOME/.platformio/packages/toolchain-gccarmnoneeabi" \
            --source-revision "${GITHUB_SHA}" \
            --map default=.pio/build/release_default/firmware.map \
            --map pixel-raid=.pio/build/release_pixel_raid/firmware.map \
            --map formula-1=.pio/build/release_formula_1/firmware.map \
            --map breakout=.pio/build/release_breakout/firmware.map \
            --map egg-journey=.pio/build/release_egg_journey/firmware.map

      - name: Build versioned user manual artifacts
        run: |
          VERSION="$(python scripts/version.py)"
          STAMPED_MANUAL="build/release-manual/clock-user-manual.${VERSION}.stamped.odt"
          REFRESHED_MANUAL="build/release-manual/clock-user-manual.${VERSION}.odt"
          mkdir -p "$(dirname "${REFRESHED_MANUAL}")"
          if [[ "${VERSION}" == *-* ]]; then
            # Prerelease manuals are publication artifacts, not repository archive entries.
            MANUAL_SOURCE="build/release-manual/clock-user-manual.${VERSION}.source.odt"
            python scripts/prepare_release_manual.py \
              --version "${VERSION}" \
              --source docs/manual-source/clock-user-manual.odt \
              --output "${MANUAL_SOURCE}"
          else
            MANUAL_SOURCE="docs/manual/clock-user-manual.${VERSION}.odt"
            test -f "${MANUAL_SOURCE}" || {
              echo "Missing frozen stable-release manual: ${MANUAL_SOURCE}" >&2
              echo "Run: python scripts/prepare_release_manual.py" >&2
              exit 1
            }
          fi
          python scripts/prepare_release_manual.py \
            --version "${VERSION}" \
            --source "${MANUAL_SOURCE}" \
            --output "${STAMPED_MANUAL}"
          python scripts/refresh_manual_screenshots.py \
            --source "${STAMPED_MANUAL}" \
            --output "${REFRESHED_MANUAL}"
          python scripts/check_user_manual.py "${REFRESHED_MANUAL}" --version "${VERSION}"
          python scripts/build_user_manual.py \
            --version "${VERSION}" \
            --source "${REFRESHED_MANUAL}" \
            --output-dir dist \
            --require-ubuntu-fonts
          python scripts/check_user_manual.py \
            "dist/clock-user-manual.${VERSION}.pdf" \
            --source "dist/clock-user-manual.${VERSION}.odt" \
            --version "${VERSION}" \
            --require-ubuntu-fonts

      - name: Validate release summary and build curated notes
        run: |
          VERSION="$(python scripts/version.py)"
          SUMMARY="docs/releases/${VERSION}/RELEASE_SUMMARY.md"
          python scripts/check_release_summary.py "${SUMMARY}" --version "${VERSION}"
          python scripts/release_notes.py "${VERSION}" \
            --summary "${SUMMARY}" \
            --output dist/RELEASE_NOTES.md
          python scripts/package_release.py finalize \
            --out-dir dist \
            --manual-odt "dist/clock-user-manual.${VERSION}.odt" \
            --manual-pdf "dist/clock-user-manual.${VERSION}.pdf" \
            --summary "${SUMMARY}" \
            --release-notes dist/RELEASE_NOTES.md \
            --changelog CHANGELOG.md

      - name: Verify release artifact contract
        run: |
          VERSION="$(python scripts/version.py)"
          for FLAVOR in default pixel-raid formula-1 breakout egg-journey; do
            test -f "dist/eurorack-clock-firmware-${FLAVOR}-${VERSION}.dfu"
          done
          test -f "dist/clock-user-manual.${VERSION}.odt"
          test -f "dist/clock-user-manual.${VERSION}.pdf"
          test -f dist/CHANGELOG.md
          test -f dist/RELEASE_SUMMARY.md
          test -f dist/RELEASE_NOTES.md
          test -f dist/LICENSE.md
          test -f dist/NOTICE.txt
          test -f dist/THIRD_PARTY_NOTICES.md
          test -f dist/MANUAL-LICENSE.md
          test -f dist/LICENSE-Apache-2.0.txt
          test -f dist/LICENSE-BSD-3-Clause.txt
          test -f dist/LICENSE-SDL-zlib.txt
          test -f dist/GNU-ARM-EMBEDDED-7.2.1-LICENSES.zip
          test -f dist/BUILD-INFO.txt
          test -f dist/SHA256SUMS.txt
          test -f dist/MD5SUMS.txt
          # Simulator binaries are deliberately not release assets.
          if compgen -G 'dist/*simulator*' > /dev/null; then
            echo "Simulator artifact unexpectedly present in dist/" >&2
            exit 1
          fi

      - name: Upload complete release bundle
        uses: actions/upload-artifact@v7
        with:
          name: clock-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          VERSION="$(python scripts/version.py)"
          ASSETS=(
            "dist/eurorack-clock-firmware-default-${VERSION}.dfu"
            "dist/eurorack-clock-firmware-pixel-raid-${VERSION}.dfu"
            "dist/eurorack-clock-firmware-formula-1-${VERSION}.dfu"
            "dist/eurorack-clock-firmware-breakout-${VERSION}.dfu"
            "dist/eurorack-clock-firmware-egg-journey-${VERSION}.dfu"
            "dist/clock-user-manual.${VERSION}.odt"
            "dist/clock-user-manual.${VERSION}.pdf"
            "dist/CHANGELOG.md"
            "dist/RELEASE_SUMMARY.md"
            "dist/RELEASE_NOTES.md"
            "dist/LICENSE.md"
            "dist/NOTICE.txt"
            "dist/THIRD_PARTY_NOTICES.md"
            "dist/MANUAL-LICENSE.md"
            "dist/LICENSE-Apache-2.0.txt"
            "dist/LICENSE-BSD-3-Clause.txt"
            "dist/LICENSE-SDL-zlib.txt"
            "dist/GNU-ARM-EMBEDDED-7.2.1-LICENSES.zip"
            "dist/BUILD-INFO.txt"
            "dist/SHA256SUMS.txt"
            "dist/MD5SUMS.txt"
          )
          # Future VCV Rack builds can drop versioned archives below dist/vcv/.
          # They are included automatically without making VCV a release prerequisite.
          shopt -s nullglob
          VCV_ASSETS=(dist/vcv/*)
          ASSETS+=("${VCV_ASSETS[@]}")
          gh release create "${GITHUB_REF_NAME}" \
            "${ASSETS[@]}" \
            --title "CLOCK ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            "${EXTRA_FLAGS[@]}"
