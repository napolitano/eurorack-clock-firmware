name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Test, build and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential doxygen libreoffice-writer poppler-utils fonts-ubuntu-classic
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19" pillow

      - name: Enforce architecture policy
        run: python scripts/check_architecture.py

      - name: Enforce embedded dependency policy
        run: python scripts/check_embedded_dependencies.py

      - name: Validate repository documentation
        run: python scripts/check_documentation.py

      - name: Validate HIL qualification ledger
        run: python scripts/check_hil_qualification.py --require-pass-from 1.5.0

      - name: Build Doxygen API documentation
        run: doxygen Doxyfile

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: python scripts/version.py --check-tag "${GITHUB_REF_NAME}"

      - name: Run release-tooling tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Validate native test inventory
        run: python scripts/check_test_inventory.py

      - name: Run native tests
        run: pio test -e native

      - name: Run complete host firmware tests and coverage gate
        run: python scripts/run_host_tests.py --skip-sanitizers

      - name: Run ASan and UBSan matrix
        run: python scripts/run_host_tests.py --sanitizers-only

      - name: Configure headless simulator
        run: cmake -S . -B build/simulator-headless -DCLOCK_SIMULATOR_WITH_SDL=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build headless simulator
        run: cmake --build build/simulator-headless --config Debug

      - name: Run simulator integration tests
        run: ctest --test-dir build/simulator-headless -C Debug --output-on-failure

      - name: Build and package firmware variants
        run: |
          rm -rf dist
          mkdir -p dist
          while IFS='|' read -r ENVIRONMENT VARIANT; do
            echo "Building ${ENVIRONMENT} (${VARIANT:-default / BEATKNECHT})"
            pio run -e "${ENVIRONMENT}"
            ARGS=(firmware --build-dir ".pio/build/${ENVIRONMENT}" --out-dir dist)
            if [[ -n "${VARIANT}" ]]; then
              ARGS+=(--variant "${VARIANT}")
            fi
            python scripts/package_release.py "${ARGS[@]}"
          done <<'EOF'
          release_default|
          release_pixel_raid|pixel-raid
          release_formula_1|formula-1
          release_breakout|breakout
          release_egg_journey|egg-journey
          EOF

      - name: Build versioned user manual artifacts
        run: |
          VERSION="$(python scripts/version.py)"
          MANUAL_SOURCE="docs/manual/releases/${VERSION}/clock-user-manual.${VERSION}.odt"
          test -f "${MANUAL_SOURCE}" || {
            echo "Missing frozen release manual: ${MANUAL_SOURCE}" >&2
            echo "Run: python scripts/prepare_release_manual.py" >&2
            exit 1
          }
          python scripts/check_user_manual.py "${MANUAL_SOURCE}" --version "${VERSION}"
          python scripts/build_user_manual.py \
            --version "${VERSION}" \
            --source "${MANUAL_SOURCE}" \
            --output-dir dist \
            --require-ubuntu-fonts
          python scripts/check_user_manual.py \
            "dist/clock-user-manual.${VERSION}.pdf" \
            --source "dist/clock-user-manual.${VERSION}.odt" \
            --version "${VERSION}" \
            --require-ubuntu-fonts

      - name: Validate release summary and build notes
        run: |
          VERSION="$(python scripts/version.py)"
          SUMMARY="docs/releases/${VERSION}/RELEASE_SUMMARY.md"
          python scripts/check_release_summary.py "${SUMMARY}" --version "${VERSION}"
          python scripts/release_notes.py "${VERSION}" --summary "${SUMMARY}" --output dist/RELEASE_NOTES.md
          python scripts/package_release.py finalize \
            --out-dir dist \
            --manual-odt "dist/clock-user-manual.${VERSION}.odt" \
            --manual-pdf "dist/clock-user-manual.${VERSION}.pdf" \
            --summary "${SUMMARY}" \
            --changelog CHANGELOG.md

      - name: Verify release artifact contract
        run: |
          VERSION="$(python scripts/version.py)"
          test -f "dist/clock-v${VERSION}-stm32f401cc.dfu"
          test -f "dist/clock-v${VERSION}-stm32f401cc-pixel-raid.dfu"
          test -f "dist/clock-v${VERSION}-stm32f401cc-formula-1.dfu"
          test -f "dist/clock-v${VERSION}-stm32f401cc-breakout.dfu"
          test -f "dist/clock-v${VERSION}-stm32f401cc-egg-journey.dfu"
          test -f "dist/clock-user-manual.${VERSION}.odt"
          test -f "dist/clock-user-manual.${VERSION}.pdf"
          test -f dist/CHANGELOG.md
          test -f dist/RELEASE_SUMMARY.md
          test -f dist/RELEASE_NOTES.md
          test -f dist/SHA256SUMS.txt
          # Simulator binaries are deliberately not release assets.
          if compgen -G 'dist/*simulator*' > /dev/null; then
            echo "Simulator artifact unexpectedly present in dist/" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA_FLAGS+=(--prerelease)
          fi
          VERSION="$(python scripts/version.py)"
          ASSETS=(
            "dist/clock-v${VERSION}-stm32f401cc.dfu"
            "dist/clock-v${VERSION}-stm32f401cc-pixel-raid.dfu"
            "dist/clock-v${VERSION}-stm32f401cc-formula-1.dfu"
            "dist/clock-v${VERSION}-stm32f401cc-breakout.dfu"
            "dist/clock-v${VERSION}-stm32f401cc-egg-journey.dfu"
            "dist/clock-user-manual.${VERSION}.odt"
            "dist/clock-user-manual.${VERSION}.pdf"
            "dist/CHANGELOG.md"
            "dist/RELEASE_SUMMARY.md"
            "dist/SHA256SUMS.txt"
          )
          # Future VCV Rack builds can drop versioned archives below dist/vcv/.
          # They are included automatically without making VCV a release prerequisite.
          shopt -s nullglob
          VCV_ASSETS=(dist/vcv/*)
          ASSETS+=("${VCV_ASSETS[@]}")
          gh release create "${GITHUB_REF_NAME}" \
            "${ASSETS[@]}" \
            --title "CLOCK ${GITHUB_REF_NAME}" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            "${EXTRA_FLAGS[@]}"
