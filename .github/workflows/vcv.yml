name: VCV Rack experimental

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'vcv/**'
      - 'src/**'
      - 'lib/clock_core/**'
      - 'sim/**'
      - 'CMakeLists.txt'
      - '.github/workflows/vcv.yml'
  pull_request:
    paths:
      - 'vcv/**'
      - 'src/**'
      - 'lib/clock_core/**'
      - 'sim/**'
      - 'CMakeLists.txt'
      - '.github/workflows/vcv.yml'

permissions:
  contents: read

env:
  RACK_SDK_VERSION: '2.6.6'
  RACK_SDK_PLATFORM: 'lin-x64'

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y jq zstd unzip

      - name: Download Rack SDK
        run: |
          sdk_url="https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${RACK_SDK_PLATFORM}.zip"
          echo "Downloading pinned Rack SDK: $sdk_url"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location \
            -o "$RUNNER_TEMP/Rack-SDK.zip" "$sdk_url"
          unzip -q "$RUNNER_TEMP/Rack-SDK.zip" -d "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/Rack-SDK/plugin.mk"

      - name: Verify VCV panel is generated from simulator geometry
        run: python scripts/generate_vcv_panel.py --check

      - name: Build CLOCK VCV plugin
        run: make -C vcv -j2 RACK_DIR="$RUNNER_TEMP/Rack-SDK"

      - name: Package CLOCK VCV plugin
        run: make -C vcv dist RACK_DIR="$RUNNER_TEMP/Rack-SDK"

      - name: Verify package contents
        run: |
          test "$(find vcv/dist -maxdepth 1 -name '*.vcvplugin' | wc -l)" -eq 1
          package="$(find vcv/dist -maxdepth 1 -name '*.vcvplugin' -print -quit)"
          tar --zstd -tf "$package" | tee "$RUNNER_TEMP/vcv-package.txt"
          grep -q '^SouthSignalLab-CLOCK/plugin.json$' "$RUNNER_TEMP/vcv-package.txt"
          grep -q '^SouthSignalLab-CLOCK/plugin.so$' "$RUNNER_TEMP/vcv-package.txt"
          grep -q '^SouthSignalLab-CLOCK/res/CLOCK.svg$' "$RUNNER_TEMP/vcv-package.txt"
          ! grep -Eqi '(^|/)(Rack-SDK|include|dep)(/|$)' "$RUNNER_TEMP/vcv-package.txt"
          ! grep -Eqi '(^|/)(libRack\.(so|dylib)|Rack\.dll)$' "$RUNNER_TEMP/vcv-package.txt"
          readelf -d vcv/plugin.so | tee "$RUNNER_TEMP/vcv-plugin-dynamic.txt"
          grep -q 'Shared library: \[libRack.so\]' "$RUNNER_TEMP/vcv-plugin-dynamic.txt"
          ls -lh "$package"

      - name: Verify Rack SDK install target
        run: |
          make -C vcv install \
            RACK_DIR="$RUNNER_TEMP/Rack-SDK" \
            RACK_USER_DIR="$RUNNER_TEMP/Rack2"
          test "$(find "$RUNNER_TEMP/Rack2/plugins-lin-x64" -maxdepth 1 -name '*.vcvplugin' | wc -l)" -eq 1

      - name: Upload VCV package
        uses: actions/upload-artifact@v7
        with:
          name: south-signal-lab-clock-vcv-linux-x64
          path: vcv/dist/*.vcvplugin
          if-no-files-found: error
