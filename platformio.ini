; PlatformIO environments for firmware, native tests, and host coverage.

[platformio]
default_envs = blackpill_f401cc_spi_ssd1306

[env:blackpill_f401cc]
platform = ststm32@19.7.1
board = blackpill_f401cc
framework = arduino
; A contiguous raw .bin would overwrite persistence sectors 1/2. The custom
; uploader extracts sector 0 and sectors 3..5 from the sparse ELF and flashes
; them separately with dfu-util.
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/upload_preserving_persistence.py" --elf "$BUILD_DIR/${PROGNAME}.elf" --objcopy "$OBJCOPY" --packages-dir "${platformio.packages_dir}"
monitor_speed = 115200
; Sectors 1 and 2 are two independent 16-KiB A/B persistence slots.
; Firmware owns sector 0 plus sectors 3..5: 224 KiB total.
board_upload.maximum_size = 229376
board_build.ldscript = ld/stm32f401cc_clock.ld
custom_memory_budget_percent = 90
extra_scripts = post:scripts/platformio_memory_gate.py
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    -Wframe-larger-than=4096
    -DEXTI_IRQ_PRIO=4
    -DEXTI_IRQ_SUBPRIO=0
    -DI2C_IRQ_PRIO=8
    -DI2C_IRQ_SUBPRIO=0
    -DI2C_TIMEOUT_TICK=10

[env:native]
platform = native@1.2.1
test_framework = unity
test_filter =
    test_clock_core
    test_realtime
    test_sync_behavior
    test_swing
    test_humanize
    test_tap_tempo
    test_controls
    test_host_firmware
test_build_src = yes
build_src_filter =
    +<**/*.cpp>
build_flags =
    -std=gnu++17
    -I src
    -I lib/clock_core/src
    -I test/support
    -I test/support/fake_framework
    -DCLOCK_HOST_TEST=1
    -DCLOCK_NATIVE_SMOKE_BUILD=1

[env:native_coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O0
    -g
    --coverage

[env:blackpill_f401cc_spi_ssd1315]
extends = env:blackpill_f401cc
build_flags =
    ${env:blackpill_f401cc.build_flags}
    -DCLOCK_DISPLAY_USE_SPI=1
    -DCLOCK_DISPLAY_CONTROLLER=1315

[env:blackpill_f401cc_spi_ssd1306]
extends = env:blackpill_f401cc
build_flags =
    ${env:blackpill_f401cc.build_flags}
    -DCLOCK_DISPLAY_USE_SPI=1
    -DCLOCK_DISPLAY_CONTROLLER=1306

; Backward-compatible alias for the current physical prototype profile.
[env:blackpill_f401cc_spi]
extends = env:blackpill_f401cc_spi_ssd1306

[env:blackpill_f401cc_i2c_ssd1306]
extends = env:blackpill_f401cc
build_flags =
    ${env:blackpill_f401cc.build_flags}
    -DCLOCK_DISPLAY_USE_SPI=0
    -DCLOCK_DISPLAY_CONTROLLER=1306

[env:blackpill_f401cc_i2c_ssd1315]
extends = env:blackpill_f401cc
build_flags =
    ${env:blackpill_f401cc.build_flags}
    -DCLOCK_DISPLAY_USE_SPI=0
    -DCLOCK_DISPLAY_CONTROLLER=1315
