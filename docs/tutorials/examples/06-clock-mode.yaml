schema: 1
id: example-clock-mode
title: "Example 06 — Clock Mode"
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: "../assets/video/south-signal-lab-intro.mp4"
  outro_video: "../assets/video/south-signal-lab-outro.mp4"
setup:
  factory_reset: true
  power: on
scenes:
  - chapter:
      number: 1
      title: "Clock Mode"
      subtitle: "A conventional clock on one Independent output"
      duration_ms: 18000
  - tutorial:
      subtitle: "Select Clock from the mode carousel."
      actions:
        - wait_ms: 1100
        - encoder_push: {}
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 2
        - button:
            name: TAP
            state: up
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - subtitle:
            text: "Start transport and watch the selected channel."
        - button:
            name: PLAY
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - wait_ms: 1400
        - scope:
            state: hide
        - button:
            name: STOP_BACK
  - callout:
      type: tip
      title: "Clock is still phase-coherent"
      body: |
        Independent Clock does not become a free-running second master clock.
      duration_ms: 3200
  - text:
      title: "Thanks for watching"
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      duration_ms: 20000
