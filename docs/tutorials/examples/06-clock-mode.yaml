schema: 1
id: example-clock-mode
title: Clock Mode
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: ../assets/video/south-signal-lab-intro.mp4
  outro_video: ../assets/video/south-signal-lab-outro.mp4
setup:
  factory_reset: true
  power: 'on'
scenes:
  - chapter:
      title: Clock Mode
      subtitle: A conventional clock on one Independent output
      narration: s01
      duration_ms: 18000
  - tutorial:
      subtitle: Select Clock from the mode carousel.
      actions:
        - beat:
            narration: s02
            duration_ms: 31700
        - wait_ms: 1100
        - encoder_push: {}
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 2
        - button:
            name: TAP
            state: up
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_top_bar
            placement: right
            label: Clock is the selected channel mode
            duration_ms: 0
        - beat_end: s02
        - beat:
            narration: s03
            duration_ms: 11400
        - subtitle:
            text: Start transport and watch the selected channel.
        - button:
            name: PLAY
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - wait_ms: 1400
        - wait_ms: 4600
        - scope:
            state: hide
        - beat_end: s03
        - beat:
            narration: s04
            duration_ms: 21600
        - button:
            name: STOP_BACK
        - focus:
            target: oled_tempo
            placement: right
            label: Gate activity follows the master timeline
            duration_ms: 0
        - beat_end: s04
  - callout:
      type: tip
      title: Clock is still phase-coherent
      body: |
        Independent Clock does not become a free-running second master clock.
      duration_ms: 3500
  - text:
      title: Thanks for watching
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: s05
      duration_ms: 20000
