schema: 1
id: example-transport-basics
title: "Example 02 — Transport Basics"
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: "../assets/video/south-signal-lab-intro.mp4"
  outro_video: "../assets/video/south-signal-lab-outro.mp4"
setup:
  factory_reset: true
  power: on
scenes:
  - chapter:
      number: 1
      title: "PLAY / PAUSE / STOP"
      subtitle: "Transport without surprises"
      duration_ms: 18000
  - tutorial:
      subtitle: "CLOCK always starts in STOP."
      actions:
        - wait_ms: 1100
        - assert:
            transport: stopped
        - subtitle:
            text: "Press PLAY to start."
        - button:
            name: PLAY
        - assert:
            transport: playing
        - wait_ms: 900
        - focus:
            target: play
            label: "PLAY starts the transport"
            duration_ms: 12900
        - subtitle:
            text: "Press PLAY again to pause."
        - button:
            name: PLAY
        - assert:
            transport: paused
        - wait_ms: 700
        - focus:
            target: oled_top_bar
            label: "PAUSE keeps transport state"
            duration_ms: 13200
        - subtitle:
            text: "Press PLAY to resume."
        - button:
            name: PLAY
        - assert:
            transport: playing
        - wait_ms: 700
        - focus:
            target: play
            label: "PLAY resumes from PAUSE"
            duration_ms: 12200
        - subtitle:
            text: "Press STOP/BACK to stop and reset global phase."
        - button:
            name: STOP_BACK
        - assert:
            transport: stopped
        - focus:
            target: stop
            label: "STOP ends the run and resets phase"
            duration_ms: 21200
  - callout:
      type: warning
      title: "STOP is authoritative"
      body: |
        A manual STOP remains authoritative even when external SYNC is present.
      duration_ms: 7500
  - text:
      title: "Thanks for watching"
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      duration_ms: 20000
