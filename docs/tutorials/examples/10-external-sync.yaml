schema: 1
id: example-external-sync-and-rst
title: "Example 10 — External SYNC and RST"
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: "../assets/video/south-signal-lab-intro.mp4"
  outro_video: "../assets/video/south-signal-lab-outro.mp4"
setup:
  factory_reset: true
  power: on
scenes:
  - chapter:
      number: 1
      title: "External SYNC and RST"
      subtitle: "Follow external timing and reset phase independently"
      narration: "s01"
      duration_ms: 18000
  - text:
      title: "Two different jobs"
      body: |
        SYNC supplies timing. In factory AUTO mode, two accepted edges establish lock.
        RST changes phase only; it does not take ownership of PLAY or STOP.
      narration: "s02"
      duration_ms: 9600
  - tutorial:
      subtitle: "Patch the external clock to SYNC and wait for lock."
      actions:
        - wait_ms: 1100
        - sync_cable:
            state: connect
        - wait_until:
            external_sync: locked
            timeout_ms: 3000
        - assert:
            clock_source: auto
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - wait_ms: 1000
        - scope:
            state: hide
        - focus:
            target: oled_top_bar
            label: "AUTO locks to valid external SYNC"
            narration: "s03"
            duration_ms: 20900
  - tutorial:
      subtitle: "Patch RST, hold its generator, then inject one reset pulse."
      actions:
        - rst_cable:
            state: connect
        - rst_generator:
            state: hold
        - rst_pulse: {}
        - assert:
            transport: playing
        - wait_ms: 800
        - focus:
            target: rst
            label: "RST restarts phase; transport stays playing"
            narration: "s04"
            duration_ms: 13700
        - subtitle:
            text: "Now press STOP. External SYNC must not override it."
        - button:
            name: STOP_BACK
        - assert:
            transport: stopped
        - wait_ms: 1000
        - assert:
            transport: stopped
        - focus:
            target: stop
            label: "Manual STOP stays authoritative"
            narration: "s05"
            duration_ms: 19500
  - callout:
      type: recipe
      title: "External timing recipe"
      steps:
        - "Use SYNC for timing and wait for lock."
        - "Use RST when you need a phase restart."
        - "Use CLOCK's transport controls for manual PLAY/STOP authority."
      narration: "s06"
      duration_ms: 8600
  - text:
      title: "Thanks for watching"
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: "s07"
      duration_ms: 20000
