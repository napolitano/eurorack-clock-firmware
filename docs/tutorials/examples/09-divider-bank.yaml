schema: 1
id: example-divider-bank
title: "Example 09 — Divider Bank"
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: "../assets/video/south-signal-lab-intro.mp4"
  outro_video: "../assets/video/south-signal-lab-outro.mp4"
setup:
  factory_reset: true
  power: on
scenes:
  - chapter:
      number: 1
      title: "Divider Bank"
      subtitle: "Eight related divisions from one source"
      duration_ms: 18000
  - tutorial:
      subtitle: "Select Divider Bank from the mode carousel."
      actions:
        - wait_ms: 1100
        - encoder_push: {}
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 1
        - button:
            name: TAP
            state: up
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: "One bank drives eight related divisions"
            duration_ms: 18900
        - subtitle:
            text: "Change the divider bank from powers of two to integers."
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: "Integer bank selected"
            duration_ms: 22300
        - button:
            name: STOP_BACK
        - button:
            name: PLAY
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - wait_ms: 1500
        - scope:
            state: hide
        - button:
            name: STOP_BACK
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: "Powers of two · integers · primes"
            duration_ms: 15900
  - callout:
      type: tip
      title: "Bank choices"
      body: |
        Divider Bank offers powers-of-two, integer, and prime division families.
      duration_ms: 10100
  - text:
      title: "Thanks for watching"
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      duration_ms: 20000
