schema: 1
id: example-power-and-first-clock
title: Example 01 — Power and First Clock
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: ../assets/video/south-signal-lab-intro.mp4
  outro_video: ../assets/video/south-signal-lab-outro.mp4
defaults:
  transition:
    type: cut
setup:
  factory_reset: true
  power: 'off'
scenes:
  - chapter:
      number: 1
      title: Getting Started
      subtitle: Power, PLAY, tempo, STOP
      narration: s01
      duration_ms: 18000
  - text:
      title: Factory state
      body: |
        CLOCK powers up in STOP at 120 BPM.
        One Clock is the factory topology and SOURCE is AUTO.
      narration: s02
      duration_ms: 7500
  - tutorial:
      subtitle: Power CLOCK on.
      actions:
        - beat:
            narration: s03
            duration_ms: 15400
        - power:
            state: 'on'
        - wait_ms: 1100
        - assert:
            transport: stopped
        - focus:
            target: oled_top_bar
            placement: right
            label: 'Top bar: status, musical context, transport'
            duration_ms: 1800
        - focus:
            target: oled_top_bar
            label: 120 BPM · One Clock · AUTO · STOP
            duration_ms: 0
        - beat_end: s03
        - beat:
            narration: s04
            duration_ms: 13900
        - subtitle:
            text: Press PLAY.
        - button:
            name: PLAY
        - assert:
            transport: playing
        - wait_ms: 900
        - focus:
            target: play
            label: PLAY starts all eight outputs
            duration_ms: 1800
        - subtitle:
            text: Turn the encoder to raise the master tempo.
        - encoder:
            direction: clockwise
            detents: 4
        - wait_ms: 700
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: Master tempo controls the shared clock
            duration_ms: 0
        - beat_end: s04
        - beat:
            narration: s05
            duration_ms: 12600
        - subtitle:
            text: Press STOP/BACK to stop and reset phase.
        - button:
            name: STOP_BACK
        - assert:
            transport: stopped
        - focus:
            target: stop
            label: STOP resets the global phase
            duration_ms: 0
        - beat_end: s05
  - callout:
      type: tip
      title: Start simple
      body: |
        One Clock sends the same master timing to all eight outputs.
        Use Independent when each output needs its own rhythmic function.
      narration: s06
      duration_ms: 7500
  - text:
      title: Thanks for watching
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: s07
      duration_ms: 20000
