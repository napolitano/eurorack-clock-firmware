schema: 1
id: example-eight-independent-clocks-walkthrough
title: Eight Independent Clocks Walkthrough
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: ../assets/video/south-signal-lab-intro.mp4
  outro_video: ../assets/video/south-signal-lab-outro.mp4
setup:
  factory_reset: true
  power: 'on'
scenes:
  - chapter:
      title: Eight Independent Clocks
      subtitle: Topology, channel selection, long-press settings
      narration: s01
      duration_ms: 18000
  - text:
      title: Start from the factory state
      body: |
        Factory state uses One Clock, but every stored channel starts in Clock mode.
        Selecting Clock therefore changes the topology to Independent and exposes eight individual Clock channels.
      narration: s02
      duration_ms: 50000
  - tutorial:
      subtitle: Independent Clock, one setting at a time.
      actions:
        - beat:
            narration: s03
            duration_ms: 23700
        - subtitle:
            text: Open the overview; choose Clock and confirm Independent.
        - wait_ms: 1400
        - encoder_push: {}
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 2
        - button:
            name: TAP
            state: up
        - wait_ms: 1200
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: Clock selected · Independent confirmed
            duration_ms: 0
        - beat_end: s03
        - beat:
            narration: s04
            duration_ms: 13900
        - subtitle:
            text: Open the channel overview. All eight channels begin in Clock mode.
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: Eight Clock channels in the overview
            duration_ms: 0
        - beat_end: s04
        - beat:
            narration: s05
            duration_ms: 13900
        - subtitle:
            text: Turn to channel four and confirm with a short encoder press.
        - encoder:
            direction: clockwise
            detents: 3
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: Channel 4 selected
            duration_ms: 0
        - beat_end: s05
        - beat:
            narration: s06
            duration_ms: 30500
        - subtitle:
            text: Long-press to open the four channel-settings groups.
        - encoder_push:
            hold_ms: 800
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: MODE · TIMING · CLOCK · OUTPUT
            duration_ms: 0
        - beat_end: s06
        - beat:
            narration: s07
            duration_ms: 19100
        - subtitle:
            text: MODE selects this channel’s function without changing its neighbours.
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: 'MODE: Clock, Euclid, Sequencer or Off'
            duration_ms: 0
        - beat_end: s07
        - beat:
            narration: s08
            duration_ms: 7400
        - subtitle:
            text: Open TIMING to inspect each timing setting.
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: 'TIMING: five separate settings'
            duration_ms: 0
        - beat_end: s08
        - beat:
            narration: s09
            duration_ms: 20000
        - subtitle:
            text: Change channel 4 from ×1 to ×2.
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: 'DIV/MULT: integer rate now ×2'
            duration_ms: 0
        - beat_end: s09
        - beat:
            narration: s10
            duration_ms: 14500
        - subtitle:
            text: NUMERATOR gives the upper part of a rational timing ratio.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 20
            width: 124
            height: 10
            placement: right
            label: 'NUMERATOR: upper part of the ratio'
            duration_ms: 0
        - beat_end: s10
        - beat:
            narration: s11
            duration_ms: 14500
        - subtitle:
            text: DENOMINATOR gives the lower part of a rational timing ratio.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: 'DENOMINATOR: lower part of the ratio'
            duration_ms: 0
        - beat_end: s11
        - beat:
            narration: s12
            duration_ms: 16300
        - subtitle:
            text: SWING alternates longer and shorter intervals.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 40
            width: 124
            height: 10
            placement: right
            label: 'SWING: alternate timing displacement'
            duration_ms: 0
        - beat_end: s12
        - beat:
            narration: s13
            duration_ms: 18200
        - subtitle:
            text: GROOVE opens the deterministic pattern timing page.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 50
            width: 124
            height: 10
            placement: right
            label: 'GROOVE: pattern-based timing'
            duration_ms: 0
        - beat_end: s13
        - beat:
            narration: s14
            duration_ms: 11100
        - subtitle:
            text: Open CLOCK to inspect both meter settings.
        - button:
            name: STOP_BACK
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: 'CLOCK: meter settings'
            duration_ms: 0
        - beat_end: s14
        - beat:
            narration: s15
            duration_ms: 11700
        - subtitle:
            text: METER BEATS determines the number of beats in this channel’s measure.
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: 'METER BEATS: beats per measure'
            duration_ms: 0
        - beat_end: s15
        - beat:
            narration: s16
            duration_ms: 12000
        - subtitle:
            text: METER UNIT determines which note value counts as one beat.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 20
            width: 124
            height: 10
            placement: right
            label: 'METER UNIT: beat note value'
            duration_ms: 0
        - beat_end: s16
        - beat:
            narration: s17
            duration_ms: 13900
        - subtitle:
            text: Open OUTPUT. Probability is the first output setting.
        - button:
            name: STOP_BACK
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: Probability · Gate · Phase · Reset · Mute
            duration_ms: 0
        - beat_end: s17
        - beat:
            narration: s18
            duration_ms: 15100
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: 'PROBABILITY: chance of a gate event'
            duration_ms: 0
        - beat_end: s18
        - beat:
            narration: s19
            duration_ms: 16300
        - subtitle:
            text: Change GATE from ten to twenty milliseconds.
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 20
            width: 124
            height: 10
            placement: right
            label: 'GATE: HIGH time now 20 ms'
            duration_ms: 0
        - beat_end: s19
        - beat:
            narration: s20
            duration_ms: 15100
        - subtitle:
            text: PHASE offsets this channel against the shared clock reference.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: 'PHASE: offset against shared reference'
            duration_ms: 0
        - beat_end: s20
        - beat:
            narration: s21
            duration_ms: 15400
        - subtitle:
            text: RESET decides whether this channel follows a global phase reset.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 40
            width: 124
            height: 10
            placement: right
            label: 'RESET: Global or Sync Free'
            duration_ms: 0
        - beat_end: s21
        - beat:
            narration: s22
            duration_ms: 14500
        - subtitle:
            text: MUTE silences this output without deleting its configuration.
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 50
            width: 124
            height: 10
            placement: right
            label: 'MUTE: silence without losing settings'
            duration_ms: 0
        - beat_end: s22
        - beat:
            narration: s23
            duration_ms: 14200
        - subtitle:
            text: Return to Performance and start channel four at its new rate.
        - button:
            name: STOP_BACK
        - button:
            name: STOP_BACK
        - button:
            name: PLAY
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - wait_ms: 6000
        - beat_end: s23
        - scope:
            state: hide
        - button:
            name: STOP_BACK
        - assert:
            transport: stopped
  - callout:
      type: tip
      title: Independent means individually configurable
      body: |
        Each output keeps its own mode and channel settings while CLOCK preserves one shared musical reference.
      narration: s24
      duration_ms: 19000
  - text:
      title: Thanks for watching
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: s25
      duration_ms: 20000
