schema: 1
id: example-eight-independent-clocks-walkthrough
title: "Example 11 — Eight Independent Clocks Walkthrough"
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: "../assets/video/south-signal-lab-intro.mp4"
  outro_video: "../assets/video/south-signal-lab-outro.mp4"
setup:
  factory_reset: true
  power: on
scenes:
  - chapter:
      number: 1
      title: "Eight Independent Clocks"
      subtitle: "Topology, channel selection, long-press settings"
      narration: "s01"
      duration_ms: 18000
  - text:
      title: "Start from the factory state"
      body: |
        Factory state uses One Clock, but every stored channel starts in Clock mode.
        Selecting Clock therefore changes the topology to Independent and exposes eight individual Clock channels.
      narration: "s02"
      duration_ms: 50000
  - tutorial:
      subtitle: "Independent Clock, one setting at a time."
      actions:
        # Voice-over beat 01: Open the overview; choose Clock and confirm Independent.
        - subtitle:
            text: "Open the overview; choose Clock and confirm Independent."
        - wait_ms: 1400
        - encoder_push: {}
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 2
        - button:
            name: TAP
            state: up
        - wait_ms: 1200
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "Clock selected · Independent confirmed"
            narration: "s03"
            duration_ms: 20000
        # Voice-over beat 02: Open the channel overview. All eight channels begin in Clock mode.
        - subtitle:
            text: "Open the channel overview. All eight channels begin in Clock mode."
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "Eight Clock channels in the overview"
            narration: "s04"
            duration_ms: 14000
        # Voice-over beat 03: Turn to channel four and confirm with a short encoder press.
        - subtitle:
            text: "Turn to channel four and confirm with a short encoder press."
        - encoder:
            direction: clockwise
            detents: 3
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "Channel 4 selected"
            narration: "s05"
            duration_ms: 13000
        # Voice-over beat 04: Long-press to open the four channel-settings groups.
        - subtitle:
            text: "Long-press to open the four channel-settings groups."
        - encoder_push:
            hold_ms: 800
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "MODE · TIMING · CLOCK · OUTPUT"
            narration: "s06"
            duration_ms: 27000
        # Voice-over beat 05: MODE selects this channel’s function without changing its neighbours.
        - subtitle:
            text: "MODE selects this channel’s function without changing its neighbours."
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: "MODE: Clock, Euclid, Sequencer or Off"
            narration: "s07"
            duration_ms: 20000
        # Voice-over beat 06: Open TIMING to inspect each timing setting.
        - subtitle:
            text: "Open TIMING to inspect each timing setting."
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "TIMING: five separate settings"
            narration: "s08"
            duration_ms: 7000
        # Voice-over beat 07: Edit DIV/MULT to make channel four twice as fast.
        - subtitle:
            text: "Change channel 4 from ×1 to ×2."
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: "DIV/MULT: integer rate now ×2"
            narration: "s09"
            duration_ms: 20000
        # Voice-over beat 08: NUMERATOR gives the upper part of a rational timing ratio.
        - subtitle:
            text: "NUMERATOR gives the upper part of a rational timing ratio."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 20
            width: 124
            height: 10
            placement: right
            label: "NUMERATOR: upper part of the ratio"
            narration: "s10"
            duration_ms: 14500
        # Voice-over beat 09: DENOMINATOR gives the lower part of a rational timing ratio.
        - subtitle:
            text: "DENOMINATOR gives the lower part of a rational timing ratio."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: "DENOMINATOR: lower part of the ratio"
            narration: "s11"
            duration_ms: 14500
        # Voice-over beat 10: SWING alternates longer and shorter intervals.
        - subtitle:
            text: "SWING alternates longer and shorter intervals."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 40
            width: 124
            height: 10
            placement: right
            label: "SWING: alternate timing displacement"
            narration: "s12"
            duration_ms: 17000
        # Voice-over beat 11: GROOVE opens the deterministic pattern timing page.
        - subtitle:
            text: "GROOVE opens the deterministic pattern timing page."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 50
            width: 124
            height: 10
            placement: right
            label: "GROOVE: pattern-based timing"
            narration: "s13"
            duration_ms: 19000
        # Voice-over beat 12: Open CLOCK to inspect both meter settings.
        - subtitle:
            text: "Open CLOCK to inspect both meter settings."
        - button:
            name: STOP_BACK
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "CLOCK: meter settings"
            narration: "s14"
            duration_ms: 8000
        # Voice-over beat 13: METER BEATS determines the number of beats in this channel’s measure.
        - subtitle:
            text: "METER BEATS determines the number of beats in this channel’s measure."
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: "METER BEATS: beats per measure"
            narration: "s15"
            duration_ms: 12000
        # Voice-over beat 14: METER UNIT determines which note value counts as one beat.
        - subtitle:
            text: "METER UNIT determines which note value counts as one beat."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 20
            width: 124
            height: 10
            placement: right
            label: "METER UNIT: beat note value"
            narration: "s16"
            duration_ms: 12500
        # Voice-over beat 15: Open OUTPUT. Probability is the first output setting.
        - subtitle:
            text: "Open OUTPUT. Probability is the first output setting."
        - button:
            name: STOP_BACK
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 0
            width: 128
            height: 64
            placement: right
            label: "Probability · Gate · Phase · Reset · Mute"
            narration: "s17"
            duration_ms: 10000
        - focus:
            target: oled_region
            x: 0
            y: 10
            width: 124
            height: 10
            placement: right
            label: "PROBABILITY: chance of a gate event"
            narration: "s18"
            duration_ms: 15000
        # Voice-over beat 16: Change GATE from ten to twenty milliseconds.
        - subtitle:
            text: "Change GATE from ten to twenty milliseconds."
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_region
            x: 0
            y: 20
            width: 124
            height: 10
            placement: right
            label: "GATE: HIGH time now 20 ms"
            narration: "s19"
            duration_ms: 17000
        # Voice-over beat 17: PHASE offsets this channel against the shared clock reference.
        - subtitle:
            text: "PHASE offsets this channel against the shared clock reference."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: "PHASE: offset against shared reference"
            narration: "s20"
            duration_ms: 15500
        # Voice-over beat 18: RESET decides whether this channel follows a global phase reset.
        - subtitle:
            text: "RESET decides whether this channel follows a global phase reset."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 40
            width: 124
            height: 10
            placement: right
            label: "RESET: Global or Sync Free"
            narration: "s21"
            duration_ms: 16000
        # Voice-over beat 19: MUTE silences this output without deleting its configuration.
        - subtitle:
            text: "MUTE silences this output without deleting its configuration."
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_region
            x: 0
            y: 50
            width: 124
            height: 10
            placement: right
            label: "MUTE: silence without losing settings"
            narration: "s22"
            duration_ms: 15000
        # Voice-over beat 20: Return to Performance and start channel four at its new rate.
        - subtitle:
            text: "Return to Performance and start channel four at its new rate."
        - button:
            name: STOP_BACK
        - button:
            name: STOP_BACK
        - button:
            name: PLAY
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - narration: "s23"
          wait_ms: 15000
        - scope:
            state: hide
        - button:
            name: STOP_BACK
        - assert:
            transport: stopped
  - callout:
      type: tip
      title: "Independent means individually configurable"
      body: |
        Each output keeps its own mode and channel settings while CLOCK preserves one shared musical reference.
      narration: "s24"
      duration_ms: 19000
  - text:
      title: "Thanks for watching"
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: "s25"
      duration_ms: 20000
