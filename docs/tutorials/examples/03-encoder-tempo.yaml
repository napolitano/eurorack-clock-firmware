schema: 1
id: example-encoder-tempo
title: Encoder Tempo
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: ../assets/video/south-signal-lab-intro.mp4
  outro_video: ../assets/video/south-signal-lab-outro.mp4
setup:
  factory_reset: true
  power: 'on'
scenes:
  - chapter:
      title: Changing Tempo
      subtitle: The encoder controls master BPM
      narration: s01
      duration_ms: 18000
  - tutorial:
      subtitle: Turn clockwise to increase BPM.
      actions:
        - beat:
            narration: s02
            duration_ms: 24900
        - wait_ms: 1100
        - encoder:
            direction: clockwise
            detents: 8
        - wait_ms: 900
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: Master BPM rises directly
            duration_ms: 0
        - beat_end: s02
        - beat:
            narration: s03
            duration_ms: 13600
        - subtitle:
            text: Turn counter-clockwise to reduce BPM.
        - encoder:
            direction: counter_clockwise
            detents: 3
        - wait_ms: 900
        - focus:
            target: oled_region
            x: 0
            y: 30
            width: 124
            height: 10
            placement: right
            label: Master BPM follows one shared timeline
            duration_ms: 0
        - beat_end: s03
  - callout:
      type: tip
      title: One master timeline
      body: |
        Tempo changes move the shared master timeline; channels remain musically related.
      narration: s04
      duration_ms: 8000
  - text:
      title: Thanks for watching
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: s05
      duration_ms: 20000
