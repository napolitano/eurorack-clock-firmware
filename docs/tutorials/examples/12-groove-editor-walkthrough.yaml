schema: 1
id: example-groove-editor-walkthrough
title: Groove Editor Walkthrough
language: en
theme: south-signal-lab-default
interaction_profile: HUMAN_NORMAL
publication:
  intro_video: ../assets/video/south-signal-lab-intro.mp4
  outro_video: ../assets/video/south-signal-lab-outro.mp4
setup:
  factory_reset: true
  power: 'off'
scenes:
  - chapter:
      title: Groove Editor
      subtitle: Custom timing, gestures, zoom, save and preview
      narration: s01
      duration_ms: 18000
  - text:
      title: Building on Eight Independent Clocks Walkthrough
      body: |
        Eight Independent Clocks Walkthrough showed how to turn One Clock into eight Independent Clock channels.
        This walkthrough repeats only the minimum setup, then focuses entirely on Custom Groove editing.
      narration: s02
      duration_ms: 3000
  - tutorial:
      subtitle: Boot CLOCK, select channel four, then enter the Groove Editor.
      actions:
        - beat:
            narration: s03
            duration_ms: 5000
        - power:
            state: 'on'
        - wait_ms: 1100
        - assert:
            transport: stopped
        - focus:
            target: oled_top_bar
            placement: right
            label: 120 BPM · One Clock · AUTO · STOP
            duration_ms: 0
        - beat_end: s03

        - beat:
            narration: s04
            duration_ms: 15000
        - subtitle:
            text: Repeat only the minimum topology step from Eight Independent Clocks Walkthrough.
        - encoder_push: {}
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 2
        - button:
            name: TAP
            state: up
        - wait_ms: 900
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_top_bar
            placement: right
            label: Independent Clock topology
            duration_ms: 0
        - beat_end: s04

        - beat:
            narration: s07
            duration_ms: 13000
        - subtitle:
            text: Select channel four and open its context settings with a long press.
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 3
        - encoder_push: {}
        - encoder_push:
            hold_ms: 800
        - focus:
            target: oled_settings_rows
            placement: right
            label: Channel 4 · MODE · TIMING · CLOCK · OUTPUT
            duration_ms: 0
        - beat_end: s07

        - beat:
            narration: s10
            duration_ms: 12000
        - subtitle:
            text: Open TIMING, then GROOVE.
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 4
        - encoder_push: {}
        - focus:
            target: oled_settings_rows
            placement: right
            label: Groove settings page
            duration_ms: 0
        - beat_end: s10

        - beat:
            narration: s12
            duration_ms: 1200
        - focus:
            target: oled_settings_top3
            placement: right
            label: PRESET · AMOUNT · ROTATE
            duration_ms: 0
        - beat_end: s12

        - beat:
            narration: s13
            duration_ms: 1200
        - focus:
            target: oled_settings_bottom2
            placement: right
            label: LOAD · EDITOR
            duration_ms: 0
        - beat_end: s13

        - beat:
            narration: s14
            duration_ms: 9000
        - subtitle:
            text: The lower Groove actions manage recording and the Custom Groove library.
        - encoder:
            direction: clockwise
            detents: 5
        - focus:
            target: oled_settings_row_5
            placement: right
            label: RECORD · separate capture workflow
            duration_ms: 600
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_settings_row_5
            placement: right
            label: RENAME · manage a saved Custom Groove
            duration_ms: 600
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_settings_row_5
            placement: right
            label: DELETE · remove a saved Custom Groove
            duration_ms: 0
        - beat_end: s14

        - beat:
            narration: s15
            duration_ms: 6000
        - encoder:
            direction: counter_clockwise
            detents: 3
        - focus:
            target: oled_settings_row_2
            placement: right
            label: EDITOR · graphical Custom Groove workspace
            duration_ms: 0
        - encoder_push: {}
        - beat_end: s15

        - beat:
            narration: s16
            duration_ms: 1200
        - subtitle:
            text: The Groove Editor live-previews the current Custom Groove draft.
        - focus:
            target: oled_groove_grid
            placement: right
            label: GROOVE EDITOR · live preview on Channel 4
            duration_ms: 0
        - beat_end: s16

        - beat:
            narration: s18
            duration_ms: 1200
        - subtitle:
            text: Read the timing grid and selected marker.
        - focus:
            target: oled_groove_grid
            placement: right
            label: Timing grid · one diamond per Custom Groove step
            duration_ms: 0
        - beat_end: s18

        - beat:
            narration: s19
            duration_ms: 1200
        - focus:
            target: oled_groove_status
            placement: above
            label: S01 +0 L16 · selected step, signed offset, pattern length
            duration_ms: 0
        - beat_end: s19

        - beat:
            narration: s20
            duration_ms: 1800
        - focus:
            target: oled_groove_zoom
            placement: above
            label: FIT or Z<n> · visible-step zoom
            duration_ms: 800
        - focus:
            target: oled_groove_status
            placement: above
            label: Offset unit · 1/256 of the nominal event interval
            duration_ms: 0
        - beat_end: s20

        - beat:
            narration: s21
            duration_ms: 4500
        - subtitle:
            text: Turn the encoder for fine signed microtiming changes.
        - encoder:
            direction: clockwise
            detents: 8
        - focus:
            target: oled_groove_status
            placement: above
            label: Positive offset moves the selected event later
            duration_ms: 0
        - beat_end: s21

        - beat:
            narration: s22
            duration_ms: 10000
        - encoder:
            direction: counter_clockwise
            detents: 36
            speed: fast
        - focus:
            target: oled_groove_status
            placement: above
            label: Negative offset moves the selected event earlier · now clearly displaced
            duration_ms: 0
        - beat_end: s22

        - beat:
            narration: s23
            duration_ms: 2000
        - subtitle:
            text: TAP advances to the next groove step.
        - button:
            name: TAP
        - focus:
            target: oled_groove_status
            placement: above
            label: TAP advances the selected step · S02
            duration_ms: 0
        - beat_end: s23

        - beat:
            narration: s24
            duration_ms: 8500
        - subtitle:
            text: Hold TAP while turning for four-times-coarser editing.
        - button:
            name: TAP
            state: down
        - encoder:
            direction: clockwise
            detents: 20
            speed: fast
        - focus:
            target: oled_groove_status
            placement: above
            label: TAP + turn · four offset units per encoder step
            duration_ms: 0
        - beat_end: s24

        - beat:
            narration: s25
            duration_ms: 2000
        - button:
            name: TAP
            state: up
        - focus:
            target: oled_groove_status
            placement: above
            label: Releasing TAP also advances to the next step · S03
            duration_ms: 0
        - beat_end: s25

        - beat:
            narration: s26
            duration_ms: 6000
        - subtitle:
            text: Hold PLAY while turning to zoom without toggling transport.
        - button:
            name: PLAY
            state: down
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_groove_zoom
            placement: above
            label: PLAY + clockwise turn · zoom in
            duration_ms: 700
        - encoder:
            direction: clockwise
            detents: 1
        - focus:
            target: oled_groove_zoom
            placement: above
            label: Fewer visible steps · more editing detail
            duration_ms: 0
        - beat_end: s26

        - beat:
            narration: s27
            duration_ms: 2200
        - button:
            name: PLAY
            state: up
        - assert:
            transport: stopped
        - focus:
            target: play
            label: PLAY release is consumed after a zoom gesture
            duration_ms: 0
        - beat_end: s27

        - beat:
            narration: s28
            duration_ms: 8000
        - subtitle:
            text: Short encoder push does nothing here; long press opens the editor menu.
        - encoder_push: {}
        - focus:
            target: encoder
            label: Short push · no direct Groove Editor action
            duration_ms: 700
        - encoder_push:
            hold_ms: 800
        - focus:
            target: oled_settings_rows
            placement: right
            label: Groove Editor menu
            duration_ms: 0
        - beat_end: s28

        - beat:
            narration: s29
            duration_ms: 1200
        - focus:
            target: oled_settings_top4
            placement: right
            label: SAVE · LOAD · ZOOM · LENGTH
            duration_ms: 0
        - beat_end: s29

        - beat:
            narration: s30
            duration_ms: 11000
        - subtitle:
            text: ZOOM changes only the editor view.
        - encoder:
            direction: clockwise
            detents: 2
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_settings_row_3
            placement: right
            label: ZOOM · changes the number of visible steps only
            duration_ms: 0
        - beat_end: s30

        - beat:
            narration: s31
            duration_ms: 11500
        - subtitle:
            text: LENGTH changes the repeating pattern size.
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 4
        - encoder_push: {}
        - focus:
            target: oled_settings_row_4
            placement: right
            label: LENGTH · change the pattern from 16 to 20 steps
            duration_ms: 0
        - beat_end: s31

        - beat:
            narration: s32
            duration_ms: 2500
        - subtitle:
            text: Return to the editor; the pattern is now twenty steps long.
        - button:
            name: STOP_BACK
        - focus:
            target: oled_groove_status
            placement: above
            label: L20 · pattern length changed, offsets preserved
            duration_ms: 0
        - beat_end: s32

        - beat:
            narration: s33
            duration_ms: 7000
        - subtitle:
            text: Save the Custom Groove into an empty library slot.
        - encoder_push:
            hold_ms: 800
        - encoder_push: {}
        - focus:
            target: oled_groove_slots
            placement: right
            label: Choose one of ten Custom Groove slots
            duration_ms: 0
        - beat_end: s33

        - beat:
            narration: s34
            duration_ms: 8000
        - encoder_push: {}
        - focus:
            target: oled_groove_name
            placement: right
            label: Generated name is editable; hold encoder to save
            duration_ms: 700
        - encoder_push:
            hold_ms: 800
        - focus:
            target: oled_settings_top3
            placement: right
            label: Saved Groove becomes active as CUSTOM · 100% · Rotate 0
            duration_ms: 0
        - beat_end: s34

        - beat:
            narration: s35
            duration_ms: 26000
        - subtitle:
            text: Scale the saved groove with AMOUNT and shift its start with ROTATE.
        - encoder:
            direction: counter_clockwise
            detents: 3
            speed: fast
        - encoder_push: {}
        - encoder:
            direction: counter_clockwise
            detents: 20
            speed: fast
        - encoder_push: {}
        - focus:
            target: oled_settings_row_2
            placement: right
            label: AMOUNT 80% · scale the timing shape toward straight
            duration_ms: 700
        - encoder:
            direction: clockwise
            detents: 1
            speed: fast
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 1
            speed: fast
        - encoder_push: {}
        - focus:
            target: oled_settings_row_3
            placement: right
            label: ROTATE 1 · shift the groove start without rewriting offsets
            duration_ms: 0
        - beat_end: s35

        - beat:
            narration: s37
            duration_ms: 10500
        - subtitle:
            text: Unsaved editor changes are protected by a discard confirmation.
        - encoder:
            direction: clockwise
            detents: 2
        - encoder_push: {}
        - encoder:
            direction: clockwise
            detents: 5
        - button:
            name: STOP_BACK
        - focus:
            target: oled_groove_confirm
            placement: right
            label: DISCARD CHANGES? · NO returns to the draft · YES discards it
            duration_ms: 0
        - beat_end: s37

        - beat:
            narration: s38
            duration_ms: 5500
        - encoder:
            direction: clockwise
            detents: 1
        - encoder_push: {}
        - focus:
            target: oled_settings_top3
            placement: right
            label: Unsaved edit discarded · saved Custom Groove remains active
            duration_ms: 0
        - beat_end: s38

        - beat:
            narration: s39
            duration_ms: 14000
        - subtitle:
            text: Return to Performance and watch the deterministic timing shape.
        - button:
            name: STOP_BACK
        - button:
            name: STOP_BACK
        - button:
            name: STOP_BACK
        - button:
            name: PLAY
        - assert:
            transport: playing
        - scope:
            state: show
            channel: visible
        - wait_ms: 7000
        - beat_end: s39
        - scope:
            state: hide
        - button:
            name: STOP_BACK
        - assert:
            transport: stopped

  - callout:
      type: tip
      title: What the Groove Editor changes
      body: |
        Custom Groove moves individual events earlier or later on a repeating pattern.
        AMOUNT scales that timing shape; ROTATE changes where the shape begins.
      narration: s40
      duration_ms: 3000

  - text:
      title: Thanks for watching
      body: |
        Follow South Signal Lab here or on Ko-fi for more CLOCK development,
        Eurorack engineering, and behind-the-scenes project work.
      narration: s41
      duration_ms: 20000
