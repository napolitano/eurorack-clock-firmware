# Publication-oriented Storybook theme. System fonts are resolved exactly; no silent substitution.
# Default family follows the CLOCK manual: Ubuntu / Ubuntu Mono.

schema: 1
id: south-signal-lab-default
line_spacing_px: 14
fonts:
  body:
    backend: system
    family: "Ubuntu"
    weight: 400
    size_px: 30
  heading:
    backend: system
    family: "Ubuntu"
    weight: 700
    size_px: 46
  chapter:
    backend: system
    family: "Ubuntu"
    weight: 700
    size_px: 64
  subtitle:
    backend: system
    family: "Ubuntu"
    weight: 400
    size_px: 30
  monospace:
    backend: system
    family: "Ubuntu Mono"
    weight: 400
    size_px: 24
colours:
  background: "#101318"
  foreground: "#F2F4F7"
  muted: "#A6AFBD"
  accent: "#0B4FC0"
  tutorial_background: "#000000"
  tutorial_surface: "#0B0D11"
  tutorial_surface_border: "#263142"
  chapter_background: "#0B4FC0"
  chapter_foreground: "#FFFFFF"
  chapter_muted: "#D7E3FF"
  subtitle_background: "#090B0F"
  subtitle_foreground: "#F4F6F8"
  focus_foreground: "#FFFFFF"
  tip_background: "#101A2D"
  tip_foreground: "#EAF0FF"
  warning_background: "#2A2110"
  warning_foreground: "#FFF2CC"
  recipe_background: "#10231B"
  recipe_foreground: "#E8F5EE"
presentation:
  # Optional path relative to docs/tutorials. When set, the image replaces the black tutorial background.
  # Phase 1.1 intentionally accepts dependency-free uncompressed 24/32-bit BMP files.
  background_image: ""
  background_image_mode: cover
  subtitle_height_px: 132
  subtitle_safe_bottom_px: 150
  focus_linger_ms: 1200
