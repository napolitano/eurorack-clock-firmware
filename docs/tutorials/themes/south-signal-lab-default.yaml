# Phase-1 Storybook uses deterministic project-local bitmap faces. Unknown requested
# faces fail validation/rendering rather than silently substituting a system font.

schema: 1
id: south-signal-lab-default
line_spacing_px: 12
fonts:
  body:
    family: "CLOCK UI"
    size_px: 28
  heading:
    family: "CLOCK UI"
    size_px: 42
  chapter:
    family: "CLOCK UI"
    size_px: 56
  subtitle:
    family: "CLOCK UI"
    size_px: 28
  monospace:
    family: "CLOCK Mono"
    size_px: 21
colours:
  background: "#FFFFFF"
  foreground: "#111111"
  muted: "#666666"
  accent: "#0B4FC0"
  tip_background: "#EAF0FF"
  tip_foreground: "#12213A"
  warning_background: "#FFF2CC"
  warning_foreground: "#2A2416"
  recipe_background: "#E8F5EE"
  recipe_foreground: "#123328"
