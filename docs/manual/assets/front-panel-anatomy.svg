<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">CLOCK front-panel anatomy</title>
  <desc id="desc">Conceptual front-panel illustration showing display, encoder, buttons, sync and reset inputs, eight outputs and LEDs; not a manufacturing drawing.</desc>
  <style>
    .panel{fill:#111;stroke:#444;stroke-width:4}.label{fill:#111;font:600 22px Ubuntu,Arial,sans-serif}.small{fill:#333;font:18px Ubuntu,Arial,sans-serif}.call{fill:none;stroke:#555;stroke-width:2}.screen{fill:#0b1720;stroke:#333;stroke-width:3}.control{fill:#eee;stroke:#333;stroke-width:3}.jack{fill:#ddd;stroke:#333;stroke-width:4}.hole{fill:#222}.led{fill:#111;stroke:#555;stroke-width:2}.tag{fill:#fff;stroke:#bbb;stroke-width:2}
  </style>
  <rect x="290" y="20" width="420" height="520" rx="8" class="panel"/>
  <text x="500" y="55" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="28" font-weight="700">CLOCK</text>
  <rect x="330" y="78" width="210" height="105" rx="4" class="screen"/>
  <text x="435" y="136" text-anchor="middle" fill="#e7f4ff" font-family="monospace" font-size="18">128 × 64 OLED</text>
  <circle cx="610" cy="130" r="37" class="control"/>
  <circle cx="610" cy="130" r="8" fill="#aaa"/>
  <text x="610" y="194" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="15">PUSH ENCODER</text>
  <circle cx="360" cy="240" r="28" fill="#b02020" stroke="#eee" stroke-width="2"/>
  <circle cx="500" cy="240" r="28" fill="#707070" stroke="#eee" stroke-width="2"/>
  <circle cx="640" cy="240" r="28" fill="#1c1c1c" stroke="#eee" stroke-width="2"/>
  <text x="360" y="285" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="14">PLAY</text>
  <text x="500" y="285" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="14">TAP</text>
  <text x="640" y="285" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="14">STOP / BACK</text>
  <circle cx="360" cy="350" r="29" class="jack"/><circle cx="360" cy="350" r="13" class="hole"/>
  <text x="360" y="397" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="14">SYNC IN</text>
  <circle cx="440" cy="350" r="29" class="jack"/><circle cx="440" cy="350" r="13" class="hole"/>
  <text x="440" y="397" text-anchor="middle" fill="#fff" font-family="Ubuntu,Arial,sans-serif" font-size="14">RST IN</text>
  <g>
    <circle cx="395" cy="452" r="6" class="led"/><circle cx="455" cy="452" r="6" class="led"/><circle cx="515" cy="452" r="6" class="led"/><circle cx="575" cy="452" r="6" class="led"/>
    <circle cx="395" cy="504" r="6" class="led"/><circle cx="455" cy="504" r="6" class="led"/><circle cx="515" cy="504" r="6" class="led"/><circle cx="575" cy="504" r="6" class="led"/>
    <circle cx="395" cy="474" r="21" class="jack"/><circle cx="395" cy="474" r="9" class="hole"/>
    <circle cx="455" cy="474" r="21" class="jack"/><circle cx="455" cy="474" r="9" class="hole"/>
    <circle cx="515" cy="474" r="21" class="jack"/><circle cx="515" cy="474" r="9" class="hole"/>
    <circle cx="575" cy="474" r="21" class="jack"/><circle cx="575" cy="474" r="9" class="hole"/>
    <circle cx="635" cy="452" r="6" class="led"/><circle cx="335" cy="452" r="6" class="led"/>
    <circle cx="335" cy="474" r="21" class="jack"/><circle cx="335" cy="474" r="9" class="hole"/>
    <circle cx="635" cy="474" r="21" class="jack"/><circle cx="635" cy="474" r="9" class="hole"/>
    <circle cx="335" cy="526" r="21" class="jack"/><circle cx="335" cy="526" r="9" class="hole"/>
    <circle cx="635" cy="526" r="21" class="jack"/><circle cx="635" cy="526" r="9" class="hole"/>
  </g>
  <rect x="30" y="80" width="210" height="58" rx="8" class="tag"/><text x="135" y="115" text-anchor="middle" class="label">Performance display</text><path d="M240 109 H315" class="call"/>
  <rect x="760" y="96" width="205" height="58" rx="8" class="tag"/><text x="862" y="131" text-anchor="middle" class="label">Encoder + push</text><path d="M760 125 H655" class="call"/>
  <rect x="35" y="220" width="190" height="58" rx="8" class="tag"/><text x="130" y="255" text-anchor="middle" class="label">Transport controls</text><path d="M225 249 H325" class="call"/>
  <rect x="760" y="330" width="195" height="58" rx="8" class="tag"/><text x="857" y="365" text-anchor="middle" class="label">SYNC / RST inputs</text><path d="M760 359 H480" class="call"/>
  <rect x="35" y="445" width="200" height="72" rx="8" class="tag"/><text x="135" y="476" text-anchor="middle" class="label">8 gate outputs</text><text x="135" y="502" text-anchor="middle" class="small">3 mm activity LEDs</text><path d="M235 481 H310" class="call"/>
</svg>
