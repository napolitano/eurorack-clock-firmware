<svg xmlns="http://www.w3.org/2000/svg" width="150" height="380" viewBox="0 0 150 380">
  <rect width="150" height="380" fill="#173f7a"/>
  <text x="12" y="19" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">CLOCK</text>
  <text x="138" y="18" fill="#d7e5ff" font-family="sans-serif" font-size="6" text-anchor="end">TRIAL FIRST</text>
  <rect x="9" y="29" width="132" height="68" rx="4" fill="#07101a" stroke="#8bb8ff" stroke-width="1"/>
  <text x="75" y="113" fill="#d7e5ff" font-family="sans-serif" font-size="7" text-anchor="middle">ENCODER</text>
  <text x="35" y="207" fill="#ffffff" font-family="sans-serif" font-size="6" text-anchor="middle">PLAY</text>
  <text x="75" y="207" fill="#ffffff" font-family="sans-serif" font-size="6" text-anchor="middle">TAP</text>
  <text x="115" y="207" fill="#ffffff" font-family="sans-serif" font-size="6" text-anchor="middle">STOP</text>
  <text x="38" y="248" fill="#ffffff" font-family="sans-serif" font-size="6" text-anchor="middle">SYNC</text>
  <text x="112" y="248" fill="#ffffff" font-family="sans-serif" font-size="6" text-anchor="middle">RST</text>
  <text x="75" y="258" fill="#d7e5ff" font-family="sans-serif" font-size="6" text-anchor="middle">OUT</text>
  <g fill="#ffffff" font-family="sans-serif" font-size="6" text-anchor="middle">
    <text x="38" y="282">1</text><text x="112" y="282">2</text>
    <text x="38" y="315">3</text><text x="112" y="315">4</text>
    <text x="38" y="348">5</text><text x="112" y="348">6</text>
    <text x="38" y="377">7</text><text x="112" y="377">8</text>
  </g>
</svg>
