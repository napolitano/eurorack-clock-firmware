# Native simulator front-panel layout.
# Author: Axel Napolitano
# License: PolyForm-Noncommercial-1.0.0
#
# ALL front-panel coordinates and physical control sizes below are millimetres.
# pixels_per_mm controls only desktop magnification; it does not change proportions.
# Panel definition: 10 HP / 3U, 50.5 x 128.5 mm.
#
# Mechanical defaults with documented dimensions:
# - C&K / Littelfuse D6R: 9.0 mm round actuator, 12.0 mm body envelope.
# - Thonkiconn TS (WQP518MA/PJ398SM): 6.0 mm bushing, approx. 3.6 mm opening.
# - QingPu W-QP-NUT-K front nut: 7.85 mm outside diameter.
# - Thonkiconn TRS (PJ366ST): same front geometry; body is 1 mm wider behind panel.
# - Output activity LEDs: 3.0 mm diameter.
#
# Button RGB values are simulator appearance values and can be changed independently
# without changing the mechanical size. Relative background paths resolve from this file.

[simulator]
window_width = 1180
window_height = 952
pixels_per_mm = 7.0
panel_x = 20
panel_y = 20
developer_x = 404
developer_y = 20
developer_width = 756
developer_height = 912

[panel]
width_mm = 50.5
height_mm = 128.5
background_image =
draw_builtin_labels = true
draw_screws = true

[display]
x_mm = 2.525
y_mm = 14.6535
width_mm = 35.9111
height_mm = 18.0351
pixel_scale = 2

[encoder]
x_mm = 44.0472
y_mm = 23.1075
# The knob/cap is a separate mechanical part from the PEC11L encoder.
# This retains the existing simulator visual OD until the final knob part number is frozen.
knob_diameter_mm = 8.4166

# C&K D6R round key switches. Mechanical dimensions are common across colors.
[play]
x_mm = 9.6792
y_mm = 48.7511
actuator_diameter_mm = 9.0
body_diameter_mm = 12.0
color = #B02020

[tap]
x_mm = 23.8472
y_mm = 48.7511
actuator_diameter_mm = 9.0
body_diameter_mm = 12.0
color = #707070

[stop]
x_mm = 38.0153
y_mm = 48.7511
actuator_diameter_mm = 9.0
body_diameter_mm = 12.0
color = #1C1C1C

# Front-visible Thonkiconn geometry. TS and TRS have the same bushing/opening
# dimensions at the panel; PJ366ST is 1 mm wider only in the body behind the panel.
[jack_ts]
nut_diameter_mm = 7.85
bushing_diameter_mm = 6.0
opening_diameter_mm = 3.6

[jack_trs]
nut_diameter_mm = 7.85
bushing_diameter_mm = 6.0
opening_diameter_mm = 3.6

[sync]
x_mm = 7.2944
y_mm = 70.1678
jack_type = ts

[reset]
x_mm = 18.6569
y_mm = 70.1678
jack_type = ts

[leds]
diameter_mm = 3.0
on_color = #EB3434
off_color = #5A3434

